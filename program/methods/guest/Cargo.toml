[package]
name = "tessera_guest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace]

[[bin]]
name = "tessera"
path = "src/bin/tessera.rs"

[dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "7e3f7f76" }
tessera_core = { path = "../../../core" }
tessera_api = { path = "../../api" }
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
borsh = { version = "1.5.7", features = ["derive"] }

[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.4-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
