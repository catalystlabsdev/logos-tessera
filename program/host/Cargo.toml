[package]
name = "tessera_host"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
lee.workspace = true
lee_core = { workspace = true, features = ["host"] }
tessera_methods = { path = "../methods" }
tessera_api = { path = "../api" }
tessera_core = { path = "../../core", features = ["std", "fixtures"] }
risc0-zkvm.workspace = true
borsh.workspace = true
anyhow.workspace = true
rand = { version = "0.8.5", features = ["std", "std_rng", "getrandom"] }
# Talking to a running sequencer (settle_rpc): LEZ's own RPC client, transaction envelope and
# program_loader messages, all at the same revision as `lee`.
sequencer_service_rpc = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "7e3f7f76", features = ["client"] }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "7e3f7f76" }
program_loader_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "7e3f7f76" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[features]
default = []
# In-process proving with LEZ; add `cuda` on an NVIDIA machine.
prove = ["lee/prove", "risc0-zkvm/prove"]
cuda = ["prove", "risc0-zkvm/cuda"]
